<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#080b18" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>FuelTracker</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="FuelTracker.styles.css" rel="stylesheet" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <script type="importmap"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<script>
    window.downloadFuelBackup = (fileName, content) => {
        const blob = new Blob([content], {
            type: "application/json"
        });

        const url = URL.createObjectURL(blob);

        const link = document.createElement("a");
        link.href = url;
        link.download = fileName;

        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);

        URL.revokeObjectURL(url);
    };
</script>

<body>
    <div id="app">
        <div class="fuel-startup-splash">
            <div class="fuel-startup-content">

                <div class="fuel-startup-logo">
                    <div class="fuel-startup-logo-glow"></div>

                    <div class="fuel-startup-pump">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M6 3h9v18H4V5a2 2 0 0 1 2-2Z"></path>
                            <path d="M7 6h5v5H7z"></path>
                            <path d="M15 8h2l3 3v6a2 2 0 0 1-4 0"></path>
                        </svg>

                        <div class="fuel-startup-pump-shine"></div>
                    </div>
                </div>

                <div class="fuel-startup-brand">
                    <span>Fuel</span><strong>Tracker</strong>
                </div>

                <div class="fuel-startup-tagline">
                    FUEL. TRACK. DRIVE.
                </div>

                <div class="fuel-startup-loader">
                    <div class="fuel-startup-loader-fill"></div>
                </div>

            </div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script>navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' });</script>
</body>

</html>
